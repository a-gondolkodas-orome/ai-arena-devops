fluent-bit:
  config:
    filters: |
      [FILTER]
          Name kubernetes
          Match kube.*
          Annotations Off
          Keep_Log Off
          K8S-Logging.Parser On
          K8S-Logging.Exclude On
          Buffer_Size 128KB
    outputs: |
      [OUTPUT]
          Name es
          Match kube.*
          Host elasticsearch-es-http
          HTTP_User elastic
          HTTP_Passwd ${ES_PASSWORD}
          Logstash_Format On
          Logstash_Prefix_Key kubernetes['container_name']
          Retry_Limit False
          Suppress_Type_Name On
          Replace_Dots On
          Trace_Error On
          tls On
          tls.verify Off
  
      [OUTPUT]
          Name es
          Match host.*
          Host elasticsearch-es-http
          HTTP_User elastic
          HTTP_Passwd ${ES_PASSWORD}
          Logstash_Format On
          Logstash_Prefix node
          Retry_Limit False
          Suppress_Type_Name On
          Replace_Dots On
          Trace_Error On
          tls On
          tls.verify Off
  env:
    - name: ES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: elasticsearch-es-elastic-user
          key: elastic

prometheus:
  server:
    persistentVolume:
      existingClaim: "prometheus"
  alertmanager:
    enabled: false


grafana:
  persistence:
    enabled: true
    existingClaim: "grafana"