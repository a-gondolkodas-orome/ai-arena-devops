apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-arena-worker-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.workerName }}
  minReplicas: 1
  maxReplicas: 6
  metrics:
  - type: External
    external:
      metric:
        name: waiting_work_count
      target:
        type: AverageValue
        averageValue: 100